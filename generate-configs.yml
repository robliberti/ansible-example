.github/workflows/generate-configs.yml

name: Generate and Validate Tomcat Configurations

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'ansible/**'
      - 'scripts/generate.sh'
      - 'scripts/validate.sh'
  pull_request:
    paths:
      - 'ansible/**'
      - 'scripts/generate.sh'
      - 'scripts/validate.sh'
  workflow_dispatch:
    inputs:
      customer:
        description: 'Customer (all, gsf, fdr, tpc)'
        required: true
        default: 'gsf'
        type: string
      products:
        description: 'Products (all, dakota, selectprime, api, trax)'
        required: true
        default: 'dakota'
        type: string
      versions:
        description: 'Versions (dakota=7.9,selectprime=1.0,api=1.0,trax=1.0)'
        required: false
        default: 'dakota=7.9,selectprime=1.0,api=1.0,trax=1.0'
        type: string
      environment:
        description: 'Environment (prod, test, dev)'
        required: true
        default: 'prod'
        type: string
      deploy_to_s3:
        description: 'Deploy to S3'
        required: false
        default: false
        type: boolean

jobs:
  determine-configs-to-generate:
    runs-on: ubuntu-latest
    outputs:
      customer: ${{ steps.set-defaults.outputs.customer }}
      products: ${{ steps.set-defaults.outputs.products }}
      environment: ${{ steps.set-defaults.outputs.environment }}
      deploy_to_s3: ${{ steps.set-defaults.outputs.deploy_to_s3 }}
      dakota_version: ${{ steps.set-defaults.outputs.dakota_version }}
      selectprime_version: ${{ steps.set-defaults.outputs.selectprime_version }}
      api_version: ${{ steps.set-defaults.outputs.api_version }}
      trax_version: ${{ steps.set-defaults.outputs.trax_version }}
      versions: ${{ steps.set-defaults.outputs.versions }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine configs to generate based on changes
        id: set-customer
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "customer=${{ github.event.inputs.customer }}" >> $GITHUB_OUTPUT
            echo "products=${{ github.event.inputs.products }}" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
            echo "deploy_to_s3=${{ github.event.inputs.deploy_to_s3 }}" >> $GITHUB_OUTPUT
            echo "versions_input=${{ github.event.inputs.versions }}" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha || 'HEAD^' }} ${{ github.event.pull_request.head.sha || 'HEAD' }})
            echo "Changed files: $CHANGED_FILES"
            
            # Check for changes in ansible/group_vars
            if echo "$CHANGED_FILES" | grep -q "ansible/group_vars/"; then
              # Extract customer names from changed files
              CUSTOMERS=$(echo "$CHANGED_FILES" | grep "ansible/group_vars/" | sed -E 's|ansible/group_vars/([^.]+)\.yml|\1|g' | tr '\n' ',' | sed 's/,$//')
              
              if [ -n "$CUSTOMERS" ]; then
                echo "customer=$CUSTOMERS" >> $GITHUB_OUTPUT
              else
                echo "customer=all" >> $GITHUB_OUTPUT
              fi
            # If templates or playbooks changed, process all customers
            elif echo "$CHANGED_FILES" | grep -q "ansible/templates/\|ansible/playbooks/"; then
              echo "customer=all" >> $GITHUB_OUTPUT
            else
              echo "customer=all" >> $GITHUB_OUTPUT
            fi
            
            # Check if specific product templates changed
            PRODUCTS=""
            if echo "$CHANGED_FILES" | grep -q "ansible/templates/dakota/\|ansible/playbooks/generate-dakota-configs.yml"; then
              PRODUCTS="dakota,"
            fi
            if echo "$CHANGED_FILES" | grep -q "ansible/templates/selectprime/\|ansible/playbooks/generate-selectprime-configs.yml"; then
              PRODUCTS="${PRODUCTS}selectprime,"
            fi
            if echo "$CHANGED_FILES" | grep -q "ansible/templates/api/\|ansible/playbooks/generate-api-configs.yml"; then
              PRODUCTS="${PRODUCTS}api,"
            fi
            if echo "$CHANGED_FILES" | grep -q "ansible/templates/trax/\|ansible/playbooks/generate-trax-configs.yml"; then
              PRODUCTS="${PRODUCTS}trax,"
            fi
            
            # If specific products changed, use them, otherwise all
            if [ -n "$PRODUCTS" ]; then
              PRODUCTS=$(echo "$PRODUCTS" | sed 's/,$//')
              echo "products=$PRODUCTS" >> $GITHUB_OUTPUT
            else
              echo "products=all" >> $GITHUB_OUTPUT
            fi
            
            # Default values for automated runs
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "deploy_to_s3=false" >> $GITHUB_OUTPUT
            echo "versions_input=dakota=7.9,selectprime=1.0,api=1.0,trax=1.0" >> $GITHUB_OUTPUT
          fi
      
      # Ensure outputs are always set with default values if missing
      - name: Set default values for outputs
        id: set-defaults
        run: |
          # Set default customer if not set
          if [ -z "${{ steps.set-customer.outputs.customer }}" ]; then
            echo "customer=all" >> $GITHUB_OUTPUT
          else
            echo "customer=${{ steps.set-customer.outputs.customer }}" >> $GITHUB_OUTPUT
          fi
          
          # Set default products if not set
          if [ -z "${{ steps.set-customer.outputs.products }}" ]; then
            echo "products=all" >> $GITHUB_OUTPUT
          else
            echo "products=${{ steps.set-customer.outputs.products }}" >> $GITHUB_OUTPUT
          fi
          
          # Set default environment if not set
          if [ -z "${{ steps.set-customer.outputs.environment }}" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=${{ steps.set-customer.outputs.environment }}" >> $GITHUB_OUTPUT
          fi
          
          # Set default deploy_to_s3 if not set
          if [ -z "${{ steps.set-customer.outputs.deploy_to_s3 }}" ]; then
            echo "deploy_to_s3=false" >> $GITHUB_OUTPUT
          else
            echo "deploy_to_s3=${{ steps.set-customer.outputs.deploy_to_s3 }}" >> $GITHUB_OUTPUT
          fi
          
          # Parse versions string
          VERSIONS="${{ steps.set-customer.outputs.versions_input || 'dakota=7.9,selectprime=1.0,api=1.0,trax=1.0' }}"
          
          # Set defaults first
          echo "dakota_version=7.9" >> $GITHUB_OUTPUT
          echo "selectprime_version=1.0" >> $GITHUB_OUTPUT  
          echo "api_version=1.0" >> $GITHUB_OUTPUT
          echo "trax_version=1.0" >> $GITHUB_OUTPUT
          
          # Parse actual versions if provided
          IFS=',' read -ra VERSION_PAIRS <<< "$VERSIONS"
          for pair in "${VERSION_PAIRS[@]}"; do
            if [[ "$pair" =~ ^dakota=(.+)$ ]]; then
              echo "dakota_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            elif [[ "$pair" =~ ^selectprime=(.+)$ ]]; then
              echo "selectprime_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            elif [[ "$pair" =~ ^api=(.+)$ ]]; then
              echo "api_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            elif [[ "$pair" =~ ^trax=(.+)$ ]]; then
              echo "trax_version=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            fi
          done
          
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

      - name: Show configs to generate
        run: |
          echo "Will generate configs for customer: ${{ steps.set-defaults.outputs.customer }}"
          echo "Will generate configs for products: ${{ steps.set-defaults.outputs.products }}"
          echo "Environment: ${{ steps.set-defaults.outputs.environment }}"
          echo "Deploy to S3: ${{ steps.set-defaults.outputs.deploy_to_s3 }}"
          echo "Product versions:"
          echo "  - Dakota: ${{ steps.set-defaults.outputs.dakota_version }}"
          echo "  - SelectPrime: ${{ steps.set-defaults.outputs.selectprime_version }}"
          echo "  - API: ${{ steps.set-defaults.outputs.api_version }}"
          echo "  - Trax: ${{ steps.set-defaults.outputs.trax_version }}"
          echo "Combined versions: ${{ steps.set-defaults.outputs.versions }}"

  generate-and-validate:
    needs: determine-configs-to-generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible jinja2 pyyaml lxml
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      # Download base Tomcat packages for each product version
      - name: Download base Tomcat packages
        run: |
          mkdir -p base_tomcat_packages
          
          # Function to download base package for a product
          download_base_package() {
            local product=$1
            local version=$2
            local env=$3
            
            echo "Downloading base Tomcat package for $product v$version ($env)"
            # Create directory structure
            mkdir -p "base_tomcat_packages/$product/v$version"
            
            # Download the base package with the hierarchical structure
            aws s3 cp "s3://tomcat-base-packages/$env/$product/v$version/tomcat-base-$product.zip" "base_tomcat_packages/$product/v$version/" || echo "No base package found for $product v$version"
          }
          
          # Download base packages based on product versions
          ENVIRONMENT="${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}"
          PRODUCTS=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr ',' ' ')
          
          for product in $PRODUCTS; do
            if [ "$product" = "all" ] || [ "$product" = "dakota" ]; then
              download_base_package "dakota" "${{ needs.determine-configs-to-generate.outputs.dakota_version }}" "$ENVIRONMENT"
            fi
            
            if [ "$product" = "all" ] || [ "$product" = "selectprime" ]; then
              download_base_package "selectprime" "${{ needs.determine-configs-to-generate.outputs.selectprime_version }}" "$ENVIRONMENT"
            fi
            
            if [ "$product" = "all" ] || [ "$product" = "api" ]; then
              download_base_package "api" "${{ needs.determine-configs-to-generate.outputs.api_version }}" "$ENVIRONMENT"
            fi
            
            if [ "$product" = "all" ] || [ "$product" = "trax" ]; then
              download_base_package "trax" "${{ needs.determine-configs-to-generate.outputs.trax_version }}" "$ENVIRONMENT"
            fi
          done
          
          echo "Downloaded base packages:"
          find base_tomcat_packages -type f | sort

      - name: Debug outputs
        run: |
          echo "Customer: '${{ needs.determine-configs-to-generate.outputs.customer }}'"
          echo "Products: '${{ needs.determine-configs-to-generate.outputs.products }}'"
          echo "Environment: '${{ needs.determine-configs-to-generate.outputs.environment }}'"
          echo "Deploy to S3: '${{ needs.determine-configs-to-generate.outputs.deploy_to_s3 }}'"
          echo "Dakota version: '${{ needs.determine-configs-to-generate.outputs.dakota_version }}'"
          echo "SelectPrime version: '${{ needs.determine-configs-to-generate.outputs.selectprime_version }}'"
          echo "API version: '${{ needs.determine-configs-to-generate.outputs.api_version }}'"
          echo "Trax version: '${{ needs.determine-configs-to-generate.outputs.trax_version }}'"
          echo "Combined versions: '${{ needs.determine-configs-to-generate.outputs.versions }}'"

      - name: Create output directory
        run: |
          mkdir -p output
          chmod 777 output
          echo "Created output directory:"
          ls -la

      - name: Generate configs
        run: |
          # Clean up the products string completely - remove all spaces around commas
          PRODUCTS_CLEAN=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr -d ' ')
          
          echo "Original products: '${{ needs.determine-configs-to-generate.outputs.products }}'"
          echo "Cleaned products: '$PRODUCTS_CLEAN'"
          
          # Parse customer input - handle both single customers and "all"
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            # Convert comma-separated string to space-separated for individual processing
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          echo "Processing customers: $CUSTOMERS"
          echo "Available customer files: $(ls -1 ansible/group_vars/*.yml | xargs basename -s .yml)"
          
          # Process each customer individually
          for customer in $CUSTOMERS; do
            echo "Generating configs for customer: $customer"
            ansible-playbook ansible/playbooks/generate-configs.yml \
              -e "customer=$customer" \
              -e "products=$PRODUCTS_CLEAN" \
              -e "versions=${{ needs.determine-configs-to-generate.outputs.versions }}"
          done

      - name: Debug generated files
        run: |
          echo "Project structure:"
          ls -la
          
          echo "Output directory:"
          ls -la output || echo "Output directory does not exist"
          
          echo "Checking for customer directories in output:"
          find output -type d -maxdepth 2 || echo "No customer directories found"
          
          echo "Searching for any XML files:"
          find . -name "*.xml" | grep -v "node_modules" || echo "No XML files found"
          
          # Fix the environment variables check to avoid exit code 1
          echo "Environment variables related to Ansible:"
          env | grep -E "PROJECT_ROOT|ANSIBLE" || echo "No PROJECT_ROOT or ANSIBLE environment variables found"
          
          echo "Ansible version:"
          ansible --version || echo "Ansible version command failed"
          
          echo "Ansible inventory:"
          ansible-inventory --list || echo "No inventory available"

      - name: Validate configs
        run: |
          # Parse customer input for validation
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          PRODUCTS="${{ needs.determine-configs-to-generate.outputs.products }}"
          VERSIONS="${{ needs.determine-configs-to-generate.outputs.versions }}"
          
          # Validate each customer individually
          for customer in $CUSTOMERS; do
            echo "Validating configs for customer: $customer"
            ansible-playbook ansible/playbooks/validate-configs.yml \
              -e "customer=$customer" \
              -e "products=$PRODUCTS" \
              -e "versions=$VERSIONS" || echo "Validation completed with warnings for customer: $customer"
          done

      - name: Prepare artifacts
        run: |
          # Create base temp_artifacts directory with proper permissions
          mkdir -p temp_artifacts
          chmod 755 temp_artifacts
          
          # Function to prepare artifacts for a customer and product
          prepare_artifact() {
            local customer=$1
            local product=$2
            local version=$3
            
            customer_upper=$(echo "$customer" | tr '[:lower:]' '[:upper:]')
            customer_lower=$(echo "$customer" | tr '[:upper:]' '[:lower:]')
            
            if [ -d "output/$product/v$version/$customer_upper" ]; then
              echo "Preparing artifact for $customer_upper $product v$version"
              
              # Create all necessary directory structure with explicit mkdir commands
              mkdir -p "temp_artifacts/$product/v$version/$customer_lower/configs"
              mkdir -p "temp_artifacts/$product/v$version"
              
              # Verify directories were created
              if [ ! -d "temp_artifacts/$product/v$version/$customer_lower/configs" ]; then
                echo "Failed to create configs directory for $customer_upper $product v$version"
                return 1
              fi
              
              if [ ! -d "temp_artifacts/$product/v$version" ]; then
                echo "Failed to create version directory for $customer_upper $product v$version"
                return 1
              fi
              
              # Copy config files
              cp -r "output/$product/v$version/$customer_upper"/* "temp_artifacts/$product/v$version/$customer_lower/configs/" || {
                echo "Failed to copy config files for $customer_upper $product v$version"
                return 1
              }
              
              # Create zip file using absolute path and ensure target directory exists
              local zip_path="temp_artifacts/$product/v$version/$customer_lower-$product-v$version-configs.zip"
              
              # Create the zip file using a more reliable method
              if (cd "output/$product/v$version/$customer_upper" && zip -r "../../../../$zip_path" .); then
                echo "Successfully created zip: $zip_path"
                # Verify the zip file was created
                if [ -f "$zip_path" ]; then
                  echo "Zip file verified: $zip_path ($(du -h "$zip_path" | cut -f1))"
                else
                  echo "Warning: Zip file creation reported success but file not found: $zip_path"
                fi
              else
                echo "Failed to create zip file for $customer_upper $product v$version"
                # Try alternative zip creation method
                echo "Attempting alternative zip creation method..."
                (cd "temp_artifacts/$product/v$version/$customer_lower/configs" && zip -r "../$customer_lower-$product-v$version-configs.zip" .) || {
                  echo "Alternative zip creation also failed for $customer_upper $product v$version"
                }
              fi
            else
              echo "Directory output/$product/v$version/$customer_upper does not exist, skipping artifact creation"
            fi
          }
          
          # List all directories in output for debugging
          echo "Available directories for artifacts:"
          find output -type d || echo "No directories found in output"
          
          # Process all customers and products as needed - DYNAMIC CUSTOMER PARSING
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          PRODUCTS=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr ',' ' ' | tr -s ' ')
          
          # Get product versions
          DAKOTA_VERSION="${{ needs.determine-configs-to-generate.outputs.dakota_version }}"
          SELECTPRIME_VERSION="${{ needs.determine-configs-to-generate.outputs.selectprime_version }}"
          API_VERSION="${{ needs.determine-configs-to-generate.outputs.api_version }}"
          TRAX_VERSION="${{ needs.determine-configs-to-generate.outputs.trax_version }}"
          
          for customer in $CUSTOMERS; do
            for product in $PRODUCTS; do
              if [ "$product" = "all" ]; then
                # Process all products
                prepare_artifact "$customer" "dakota" "$DAKOTA_VERSION"
                prepare_artifact "$customer" "selectprime" "$SELECTPRIME_VERSION"
                prepare_artifact "$customer" "api" "$API_VERSION"
                prepare_artifact "$customer" "trax" "$TRAX_VERSION"
              elif [ "$product" = "dakota" ]; then
                prepare_artifact "$customer" "$product" "$DAKOTA_VERSION"
              elif [ "$product" = "selectprime" ]; then
                prepare_artifact "$customer" "$product" "$SELECTPRIME_VERSION"
              elif [ "$product" = "api" ]; then
                prepare_artifact "$customer" "$product" "$API_VERSION"
              elif [ "$product" = "trax" ]; then
                prepare_artifact "$customer" "$product" "$TRAX_VERSION"
              fi
            done
          done
          
          # Debug artifact output
          echo "Contents of temp_artifacts directory:"
          find temp_artifacts -type f || echo "No files found in temp_artifacts"
          
          echo "ZIP files created:"
          find temp_artifacts -name "*.zip" -exec ls -lh {} \; || echo "No ZIP files found"

      # Create a summary of what artifacts were generated and upload only those
      - name: Prepare artifact summary and upload
        run: |
          echo "## Generated Artifacts Summary" >> $GITHUB_STEP_SUMMARY
          
          # Initialize counters
          total_artifacts=0
          
          # Function to attempt artifact upload if directory exists
          upload_if_exists() {
            local customer=$1
            local product=$2  
            local version=$3
            local customer_lower=$(echo "$customer" | tr '[:upper:]' '[:lower:]')
            local artifact_path="temp_artifacts/$product/v$version/$customer_lower"
            
            if [ -d "$artifact_path" ] && [ "$(ls -A "$artifact_path" 2>/dev/null)" ]; then
              echo "✅ Found: $customer-$product-v$version-configs" >> $GITHUB_STEP_SUMMARY
              echo "   Path: $artifact_path" >> $GITHUB_STEP_SUMMARY
              echo "   Files: $(find "$artifact_path" -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
              
              # Create upload marker for the next step
              echo "$customer_lower|$product|v$version|$artifact_path" >> /tmp/artifacts_to_upload.txt
              
              total_artifacts=$((total_artifacts + 1))
              return 0
            else
              echo "❌ Not found: $customer-$product-v$version-configs (Path: $artifact_path)" >> $GITHUB_STEP_SUMMARY
              return 0  # Changed from return 1 to return 0 to avoid script failure
            fi
          }
          
          # Check all possible combinations based on what was requested - DYNAMIC CUSTOMER PARSING
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          PRODUCTS=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr ',' ' ' | tr -s ' ')
          
          # If "all" was specified for products, expand to actual product list
          if [[ "$PRODUCTS" == *"all"* ]]; then
            PRODUCTS="dakota selectprime api trax"
          fi
          
          echo "Checking for artifacts..." >> $GITHUB_STEP_SUMMARY
          echo "Customers: $CUSTOMERS" >> $GITHUB_STEP_SUMMARY
          echo "Products: $PRODUCTS" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check each customer/product combination
          for customer in $CUSTOMERS; do
            customer_upper=$(echo "$customer" | tr '[:lower:]' '[:upper:]')
            
            for product in $PRODUCTS; do
              # Trim whitespace from product name
              product=$(echo "$product" | xargs)
              case $product in
                "dakota")
                  upload_if_exists "$customer_upper" "$product" "${{ needs.determine-configs-to-generate.outputs.dakota_version }}" || true
                  ;;
                "selectprime")
                  upload_if_exists "$customer_upper" "$product" "${{ needs.determine-configs-to-generate.outputs.selectprime_version }}" || true
                  ;;
                "api")
                  upload_if_exists "$customer_upper" "$product" "${{ needs.determine-configs-to-generate.outputs.api_version }}" || true
                  ;;
                "trax")
                  upload_if_exists "$customer_upper" "$product" "${{ needs.determine-configs-to-generate.outputs.trax_version }}" || true
                  ;;
                *)
                  echo "❓ Unknown product: '$product'" >> $GITHUB_STEP_SUMMARY
                  ;;
              esac
            done
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total artifacts found: $total_artifacts**" >> $GITHUB_STEP_SUMMARY
          
          if [ $total_artifacts -eq 0 ]; then
            echo "❌ No artifacts were generated" >> $GITHUB_STEP_SUMMARY
            echo "Check the generation step for errors" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Debug Information:**" >> $GITHUB_STEP_SUMMARY
            echo "Expected artifact structure: temp_artifacts/\{product\}/v\{version\}/\{customer_lower\}/" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Actual temp_artifacts contents:**" >> $GITHUB_STEP_SUMMARY
            if [ -d "temp_artifacts" ]; then
              find temp_artifacts -type d | head -20 >> $GITHUB_STEP_SUMMARY || echo "No directories found" >> $GITHUB_STEP_SUMMARY
            else
              echo "temp_artifacts directory does not exist" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Save count for next step
          echo "artifact_count=$total_artifacts" >> $GITHUB_OUTPUT

      # Upload Dakota configs for all customers (using dynamic versions)
      - name: Upload GSF Dakota configs
        if: hashFiles('temp_artifacts/dakota/v${{ needs.determine-configs-to-generate.outputs.dakota_version }}/gsf/**') != ''
        uses: actions/upload-artifact@v4
        with:
