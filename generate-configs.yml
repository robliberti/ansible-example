          path: temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/gsf/

      - name: Upload FDR Trax configs
        if: hashFiles('temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/fdr/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: fdr-trax-v${{ needs.determine-configs-to-generate.outputs.trax_version }}-configs
          path: temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/fdr/

      - name: Upload TPC Trax configs
        if: hashFiles('temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/tpc/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tpc-trax-v${{ needs.determine-configs-to-generate.outputs.trax_version }}-configs
          path: temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/tpc/

      - name: Upload ABC Trax configs
        if: hashFiles('temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/abc/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: abc-trax-v${{ needs.determine-configs-to-generate.outputs.trax_version }}-configs
          path: temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/abc/

      - name: Upload XYZ Trax configs
        if: hashFiles('temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/xyz/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: xyz-trax-v${{ needs.determine-configs-to-generate.outputs.trax_version }}-configs
          path: temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/xyz/
          
      - name: Prepare complete Tomcat packages
        run: |
          mkdir -p complete_packages
          
          # Function to prepare complete package for a customer and product
          prepare_complete_package() {
            local customer=$1
            local product=$2
            local version=$3
            
            customer_upper=$(echo "$customer" | tr '[:lower:]' '[:upper:]')
            customer_lower=$(echo "$customer" | tr '[:upper:]' '[:lower:]')
            
            # Check if base package exists
            if [ -f "base_tomcat_packages/$product/v$version/tomcat-base-$product.zip" ]; then
              echo "Preparing complete package for $customer_upper $product v$version"
              
              # Create hierarchical directory structure
              mkdir -p "complete_packages/$product/v$version/$customer_lower"
              mkdir -p "temp_extract/$product/v$version/$customer_lower"
              
              # Extract base package
              unzip -q "base_tomcat_packages/$product/v$version/tomcat-base-$product.zip" -d "temp_extract/$product/v$version/$customer_lower"
              
              # Check if config directory exists
              if [ -d "output/$product/v$version/$customer_upper" ]; then
                # Copy configs to the right location in the extracted package
                cp -r "output/$product/v$version/$customer_upper"/* "temp_extract/$product/v$version/$customer_lower/tomcat/conf/"
                
                # Create a new zip with base + configs
                (cd "temp_extract/$product/v$version/$customer_lower" && zip -rq "../../../../complete_packages/$product/v$version/$customer_lower/$customer_lower-$product-v$version-complete.zip" .)
                
                # Also copy to temp_artifacts for upload
                mkdir -p "temp_artifacts/$product/v$version"
                cp "complete_packages/$product/v$version/$customer_lower/$customer_lower-$product-v$version-complete.zip" "temp_artifacts/$product/v$version/"
                
                echo "Created complete package: complete_packages/$product/v$version/$customer_lower/$customer_lower-$product-v$version-complete.zip"
              else
                echo "No configs found for $customer_upper $product v$version"
              fi
            else
              echo "No base package found for $product v$version, skipping complete package creation"
            fi
          }
          
          # Process all customers and products as needed - DYNAMIC CUSTOMER PARSING
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          PRODUCTS=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr ',' ' ' | tr -s ' ')
          
          # Get product versions
          DAKOTA_VERSION="${{ needs.determine-configs-to-generate.outputs.dakota_version }}"
          SELECTPRIME_VERSION="${{ needs.determine-configs-to-generate.outputs.selectprime_version }}"
          API_VERSION="${{ needs.determine-configs-to-generate.outputs.api_version }}"
          TRAX_VERSION="${{ needs.determine-configs-to-generate.outputs.trax_version }}"
          
          for customer in $CUSTOMERS; do
            for product in $PRODUCTS; do
              # Trim whitespace from product name
              product=$(echo "$product" | xargs)
              if [ "$product" = "all" ]; then
                # Process all products
                prepare_complete_package "$customer" "dakota" "$DAKOTA_VERSION"
                prepare_complete_package "$customer" "selectprime" "$SELECTPRIME_VERSION"
                prepare_complete_package "$customer" "api" "$API_VERSION"
                prepare_complete_package "$customer" "trax" "$TRAX_VERSION"
              elif [ "$product" = "dakota" ]; then
                prepare_complete_package "$customer" "$product" "$DAKOTA_VERSION"
              elif [ "$product" = "selectprime" ]; then
                prepare_complete_package "$customer" "$product" "$SELECTPRIME_VERSION"
              elif [ "$product" = "api" ]; then
                prepare_complete_package "$customer" "$product" "$API_VERSION"
              elif [ "$product" = "trax" ]; then
                prepare_complete_package "$customer" "$product" "$TRAX_VERSION"
              fi
            done
          done
          
          # List created packages
          echo "Complete packages created:"
          ls -la complete_packages/ || echo "No complete packages were created"
          
          # Copy complete packages to temp_artifacts for upload
          find complete_packages -name "*.zip" -exec cp {} temp_artifacts/ \; || echo "No complete packages to copy"

      - name: Upload all ZIP configs
        if: hashFiles('temp_artifacts/*.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: all-configs-zip
          path: temp_artifacts/*.zip

  # New job for S3 deployment
  deploy-to-s3:
    needs: [determine-configs-to-generate, generate-and-validate]
    if: needs.determine-configs-to-generate.outputs.deploy_to_s3 == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}
      # URL parameter points to the actual bucket
      url: https://console.aws.amazon.com/s3/buckets/bfc-tomcat-configs/${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_TOMCAT_CONFIGS }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_TOMCAT_CONFIGS }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install AWS CLI
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      # Prepare artifacts with ZIP files
      - name: Prepare artifacts with ZIP files
        run: |
          mkdir -p temp_artifacts
          
          # Copy individual config directories
          for customer_dir in downloaded_artifacts/*-*/; do
            if [[ "$customer_dir" == *"all-configs-zip"* ]]; then
              continue
            fi
            
            # Extract customer and product names from directory
            dir_name=$(basename "$customer_dir")
            customer_lower=$(echo "$dir_name" | cut -d'-' -f1)
            product=$(echo "$dir_name" | cut -d'-' -f2)
            
            customer_upper=$(echo "$customer_lower" | tr '[:lower:]' '[:upper:]')
            
            # Create output directory structure
            mkdir -p "output/$product/$customer_upper"
            
            # Copy artifact contents
            cp -r "$customer_dir"/* "output/$product/$customer_upper/" || echo "No files to copy for $customer_upper $product"
          done
          
          # Copy ZIP files to temp_artifacts
          if [ -d "downloaded_artifacts/all-configs-zip" ]; then
            cp downloaded_artifacts/all-configs-zip/*.zip temp_artifacts/ || echo "No ZIP files found"
            echo "Available ZIP files:"
            ls -la temp_artifacts/*.zip || echo "No ZIP files in temp_artifacts"
          else
            echo "No all-configs-zip artifact found"
          fi

      - name: Make scripts executable
        run: chmod +x scripts/*.sh
        
      - name: Debug S3 deployment
        run: |
          echo "Preparing to deploy to S3"
          echo "Customer: ${{ needs.determine-configs-to-generate.outputs.customer }}"
          echo "Products: ${{ needs.determine-configs-to-generate.outputs.products }}"
          echo "Environment: ${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
          echo "AWS credentials: $(if [ -n "$AWS_ACCESS_KEY_ID" ]; then echo "Set"; else echo "Not set"; fi)"
          
          echo "Downloaded artifacts:"
          ls -la downloaded_artifacts || echo "No downloaded artifacts directory"
          
          echo "Available ZIP files in temp_artifacts:"
          ls -la temp_artifacts/*.zip || echo "No ZIP files in temp_artifacts"

      - name: Deploy to S3
        run: |
          # Process all customers and products as needed - DYNAMIC CUSTOMER PARSING
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
          fi
          
          PRODUCTS=$(echo "${{ needs.determine-configs-to-generate.outputs.products }}" | tr ',' ' ' | tr -s ' ')
          ENVIRONMENT="${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}"
          
          # Get product versions
          DAKOTA_VERSION="${{ needs.determine-configs-to-generate.outputs.dakota_version }}"
          SELECTPRIME_VERSION="${{ needs.determine-configs-to-generate.outputs.selectprime_version }}"
          API_VERSION="${{ needs.determine-configs-to-generate.outputs.api_version }}"
          TRAX_VERSION="${{ needs.determine-configs-to-generate.outputs.trax_version }}"
          
          # Function to upload configs to S3 with new versioned structure
          upload_configs() {
            local customer=$1
            local product=$2
            local version=$3
            local env=$4
            
            customer_upper=$(echo "$customer" | tr '[:lower:]' '[:upper:]')
            customer_lower=$(echo "$customer" | tr '[:upper:]' '[:lower:]')
            
            echo "Uploading $product v$version configs for $customer_upper to S3..."
            
            # New S3 path structure: environment/prod/product/version/customer/
            local s3_base_path="s3://bfc-tomcat-configs/$env/$product/v$version/$customer_upper"
            
            # Upload individual config files if directory exists
            if [ -d "downloaded_artifacts/$customer_lower-$product-v$version-configs/configs" ]; then
              echo "Uploading individual config files to $s3_base_path/configs/"
              aws s3 cp "downloaded_artifacts/$customer_lower-$product-v$version-configs/configs/" "$s3_base_path/configs/" --recursive || echo "Failed to upload config files"
            elif [ -d "downloaded_artifacts/$customer_lower-$product-v$version-configs" ]; then
              echo "Uploading config files from root directory to $s3_base_path/configs/"
              aws s3 cp "downloaded_artifacts/$customer_lower-$product-v$version-configs/" "$s3_base_path/configs/" --recursive || echo "Failed to upload config files"
            else
              echo "No config directory found for $customer_upper $product v$version"
            fi
            
            # Upload complete package if it exists
            if [ -f "temp_artifacts/$customer_lower-$product-v$version-complete.zip" ]; then
              echo "Uploading complete package for $customer_upper $product v$version to $s3_base_path/complete/"
              aws s3 cp "temp_artifacts/$customer_lower-$product-v$version-complete.zip" "$s3_base_path/complete/" || echo "Failed to upload complete package"
            fi
            
            # Upload config ZIP if it exists
            if [ -f "temp_artifacts/$customer_lower-$product-v$version-configs.zip" ]; then
              echo "Uploading config ZIP for $customer_upper $product v$version to $s3_base_path/configs/"
              aws s3 cp "temp_artifacts/$customer_lower-$product-v$version-configs.zip" "$s3_base_path/configs/" || echo "Failed to upload config ZIP"
            fi
          }
          
          # Upload configs for all customers and products
          for customer in $CUSTOMERS; do
            for product in $PRODUCTS; do
              # Trim whitespace from product name
              product=$(echo "$product" | xargs)
              if [ "$product" = "all" ]; then
                # Process all products with their respective versions
                upload_configs "$customer" "dakota" "$DAKOTA_VERSION" "$ENVIRONMENT"
                upload_configs "$customer" "selectprime" "$SELECTPRIME_VERSION" "$ENVIRONMENT"
                upload_configs "$customer" "api" "$API_VERSION" "$ENVIRONMENT"
                upload_configs "$customer" "trax" "$TRAX_VERSION" "$ENVIRONMENT"
              elif [ "$product" = "dakota" ]; then
                upload_configs "$customer" "$product" "$DAKOTA_VERSION" "$ENVIRONMENT"
              elif [ "$product" = "selectprime" ]; then
                upload_configs "$customer" "$product" "$SELECTPRIME_VERSION" "$ENVIRONMENT"
              elif [ "$product" = "api" ]; then
                upload_configs "$customer" "$product" "$API_VERSION" "$ENVIRONMENT"
              elif [ "$product" = "trax" ]; then
                upload_configs "$customer" "$product" "$TRAX_VERSION" "$ENVIRONMENT"
              fi
            done
          done

      - name: Show S3 deployment results
        run: |
          echo "## S3 Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show what was uploaded
          ENVIRONMENT="${{ needs.determine-configs-to-generate.outputs.environment || 'prod' }}"
          
          echo "Files uploaded to S3 bucket: bfc-tomcat-configs" >> $GITHUB_STEP_SUMMARY
          echo "Environment: $ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Track files uploaded in this run
          uploaded_files_count=0
          
          # Function to check and report uploaded files for a specific customer/product/version
          report_uploaded_files() {
            local customer=$1
            local product=$2
            local version=$3
            local env=$4
            
            customer_upper=$(echo "$customer" | tr '[:lower:]' '[:upper:]')
            customer_lower=$(echo "$customer" | tr '[:upper:]' '[:lower:]')
            
            local s3_base_path="s3://bfc-tomcat-configs/$env/$product/v$version/$customer_upper"
            
            echo "Files uploaded for $customer_upper $product v$version:" >> /tmp/this_run_uploads.txt
            
            # Check if configs were uploaded
            if [ -d "downloaded_artifacts/$customer_lower-$product-v$version-configs" ]; then
              echo "  📁 Config files to: $s3_base_path/configs/" >> /tmp/this_run_uploads.txt
              find "downloaded_artifacts/$customer_lower-$product-v$version-configs" -type f | while read file; do
                filename=$(basename "$file")
                echo "    - $filename" >> /tmp/this_run_uploads.txt
                uploaded_files_count=$((uploaded_files_count + 1))
              done
            fi
            
            # Check if complete package was uploaded
            if [ -f "temp_artifacts/$customer_lower-$product-v$version-complete.zip" ]; then
              echo "  📦 Complete package to: $s3_base_path/complete/" >> /tmp/this_run_uploads.txt
              echo "    - $customer_lower-$product-v$version-complete.zip" >> /tmp/this_run_uploads.txt
              uploaded_files_count=$((uploaded_files_count + 1))
            fi
            
            # Check if config ZIP was uploaded
            if [ -f "temp_artifacts/$customer_lower-$product-v$version-configs.zip" ]; then
              echo "  📄 Config ZIP to: $s3_base_path/configs/" >> /tmp/this_run_uploads.txt
              echo "    - $customer_lower-$product-v$version-configs.zip" >> /tmp/this_run_uploads.txt
              uploaded_files_count=$((uploaded_files_count + 1))
            fi
          }
          
          # Create report for this run's uploads
          echo "" > /tmp/this_run_uploads.txt
          
          # Process all customers and products from this run - DYNAMIC CUSTOMER PARSING
          CUSTOMER_INPUT="${{ needs.determine-configs-to-generate.outputs.customer }}"
          if [ "$CUSTOMER_INPUT" = "all" ]; then
            # Dynamically get all customers from group_vars directory
            CUSTOMERS=""
            for customer_file in ansible/group_vars/*.yml; do
              if [ -f "$customer_file" ]; then
                customer_name=$(basename "$customer_file" .yml)
                CUSTOMERS="$CUSTOMERS $customer_name"
              fi
            done
            # Trim leading/trailing spaces
            CUSTOMERS=$(echo "$CUSTOMERS" | xargs)
          else
            CUSTOMERS=$(echo "$CUSTOMER_INPUT" | sed 's/,/ /g')
