      # Upload Trax configs for all customers (using dynamic versions)  
      - name: Upload GSF Trax configs
        if: hashFiles('temp_artifacts/trax/v${{ needs.determine-configs-to-generate.outputs.trax_version }}/gsf/**') != ''
        uses: actions/upload-artifact@v4
        with:
